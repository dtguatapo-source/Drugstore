<!-- MIGRACIÓN ANGULAR 21: Lectura de la signal mostrarLayout() con paréntesis -->
@if (mostrarLayout()) {
  <header class="main-header">
    <nav class="navbar">
      
      <div class="logo-container" routerLink="/dashboard">
        <div class="logo-circulo">
          <img src="iconos/flor.png" alt="logo">
        </div>
        <span class="nombre-sistema">SISTEMA DROGUERÍA PILI</span>
      </div>

      <div class="LinksNav">
        <a class="nav-link" routerLink="/dashboard" routerLinkActive="activo">Inicio</a>
        <a class="nav-link" routerLink="/inventory" routerLinkActive="activo">Inventario</a>
        <a class="nav-link" routerLink="/purchases" routerLinkActive="activo">Compras</a>
        <a class="nav-link" routerLink="/suppliers" routerLinkActive="activo">Proveedores</a>
        <a class="nav-link" routerLink="/sales" routerLinkActive="activo">Ventas</a>
        <a class="nav-link" routerLink="/reports" routerLinkActive="activo">Informes</a>
      </div>

      <button
        type="button"
        class="user-section"
        (click)="salir()"
        title="Cerrar sesión"
        aria-label="Cerrar sesión"
      >
        <span class="admin-badge">Admin</span>
      </button>

    </nav>
  </header>
}

<main class="content">
  <router-outlet></router-outlet>
</main>
