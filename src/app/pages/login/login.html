<div class="auth-page">
  <div class="auth-card">
    <aside class="auth-brand">
      <div class="brand-logo">
        <img src="iconos/flor.png" alt="Logo de Droguería Pili" />
      </div>
      <h1>Droguería Pili</h1>
      <p class="brand-subtitle">Sistema Integral de Gestión Farmacéutica</p>
    </aside>

    <section class="auth-form">
      <h2>Iniciar Sesión</h2>
      <p class="form-help">Ingrese sus credenciales para acceder al sistema.</p>

      <form (ngSubmit)="login()">
        <div class="field">
          <label for="usuario">Usuario</label>
          <input
            id="usuario"
            type="text"
            name="usuario"
            placeholder="Ingrese su usuario"
            [(ngModel)]="username"
            autocomplete="username"
            required
          />
        </div>

        <div class="field">
          <label for="clave">Contraseña</label>
          <input
            id="clave"
            type="password"
            name="clave"
            placeholder="Ingrese su contraseña"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="intento()">
          {{ intento() ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      @if (error()) {
        <div class="alerta" role="alert">{{ mensaje() }}</div>
      }

      <div class="auth-switch">
        <p>¿No tiene cuenta? <a (click)="irARegistro()">Regístrese aquí</a></p>
      </div>
    </section>
  </div>
</div>
